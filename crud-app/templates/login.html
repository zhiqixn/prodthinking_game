{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}auth{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to book the study room, dance studio and other common rooms.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted center">New resident? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
